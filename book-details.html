<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Details - Literary Emporium</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #202733;
            min-height: 100vh;
        }

        header {
            background: #172337;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand h1 {
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .brand p {
            margin-top: 5px;
            font-size: 12px;
            color: #c5ccd5;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #b7c0cc;
        }

        .language-select {
            padding: 8px 10px;
            border: 1px solid #c5ccd5;
            background: #172337;
            color: white;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .container {
            width: 84%;
            max-width: 950px;
            margin: 55px auto;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h2 {
            font-size: 30px;
            font-weight: 600;
            color: #172337;
        }

        .details-card {
            background: white;
            border: 1px solid #dce1e7;
            padding: 40px;
        }

        .details-card h1 {
            font-size: 30px;
            color: #172337;
            margin-bottom: 10px;
        }

        .author {
            font-size: 16px;
            color: #667080;
            margin-bottom: 30px;
        }

        .details-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #e4e7eb;
            font-size: 14px;
        }

        .details-label {
            color: #667080;
            font-weight: 600;
        }

        .details-value {
            color: #202733;
        }

        .description {
            margin-top: 28px;
            line-height: 1.7;
            color: #5f6b7a;
            font-size: 15px;
        }

        .price {
            margin-top: 28px;
            font-size: 24px;
            font-weight: 600;
            color: #7c2637;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .cart-button {
            padding: 13px 24px;
            border: none;
            background: #172337;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .cart-button:hover {
            background: #27364c;
        }

        .wishlist-button {
            padding: 13px 24px;
            border: 1px solid #172337;
            background: white;
            color: #172337;
            font-size: 14px;
            cursor: pointer;
        }

        .wishlist-button:hover {
            background: #eef1f4;
        }

        .back-link {
            color: #172337;
            text-decoration: none;
            font-size: 14px;
        }

        .message {
            margin-top: 18px;
            font-size: 13px;
            color: #315c49;
        }

        .reviews-section {
            margin-top: 35px;
            background: white;
            border: 1px solid #dce1e7;
            padding: 40px;
        }

        .reviews-section h2 {
            font-size: 24px;
            color: #172337;
            margin-bottom: 25px;
        }

        .review-form {
            border-bottom: 1px solid #e1e5ea;
            padding-bottom: 30px;
            margin-bottom: 30px;
        }

        .review-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #667080;
            margin-bottom: 10px;
        }

        .star-rating {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .star-rating button {
            border: none;
            background: transparent;
            color: #c5ccd5;
            font-size: 30px;
            cursor: pointer;
            padding: 0;
        }

        .star-rating button.active {
            color: #7c2637;
        }

        .star-rating button:hover {
            color: #7c2637;
        }

        .review-text {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #cfd5dc;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #202733;
            outline: none;
        }

        .review-text:focus {
            border-color: #172337;
        }

        .submit-review {
            margin-top: 15px;
            padding: 12px 22px;
            border: none;
            background: #172337;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .submit-review:hover {
            background: #27364c;
        }

        .review-message {
            margin-top: 12px;
            font-size: 13px;
            color: #315c49;
        }

        .review-item {
            padding: 20px 0;
            border-bottom: 1px solid #e4e7eb;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-rating {
            color: #7c2637;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .review-user {
            font-size: 13px;
            font-weight: 600;
            color: #172337;
            margin-bottom: 8px;

            color: #5f6b7a;

                    type="button"
                    data-rating="2">★</button>

                <button
                    type="button"
                    data-rating="3">★</button>

                <button
                    type="button"
                    data-rating="4">★</button>

                <button
                    type="button"
                    data-rating="5">★</button>

            </div>


            <input
                type="hidden"
                id="reviewRating"
                value="5">


            <label
                class="review-label"
                for="reviewText"
                data-i18n="yourReview">

                Your Review

            </label>


            <textarea

                class="review-text"

            </textarea>


            <button
                type="button"
                class="submit-review"
                id="submitReviewButton"
                data-i18n="submitReview">

                Submit Review

            </button>


            <p
                class="review-message"

            </p>

        </div>


        <div id="reviewsContainer">

            <p

                No reviews yet.

            </p>

        </div>


    </section>


</main>

    function applyBookDetailsLanguage() {

        const language =
            localStorage.getItem(
                "literaryEmporiumLanguage"
            ) || "en";


        const selected =
            bookDetailsTranslations[language] ||
            bookDetailsTranslations.en;


        document
            .querySelectorAll("[data-i18n]")
            .forEach(function(element) {

                const key =
                    element.getAttribute(
                        "data-i18n"
                    );


                if (selected[key]) {

                    element.textContent =
                        selected[key];

                }

            });


        document
            .querySelectorAll(
                "[data-i18n-placeholder]"
            )
            .forEach(function(element) {

                const key =
                    element.getAttribute(
                        "data-i18n-placeholder"
                    );


                if (selected[key]) {

                    element.placeholder =
                        selected[key];

                }

            });

    }


    const languageSelector =
        document.getElementById(
            "languageSelector"
        );


    if (languageSelector) {

        languageSelector.value =
            localStorage.getItem(
                "literaryEmporiumLanguage"
            ) || "en";


        languageSelector.addEventListener(
            "change",
            function() {

                localStorage.setItem(
                    "literaryEmporiumLanguage",
                    this.value
                );

                applyBookDetailsLanguage();

                if (
                    typeof setLanguage ===
                    "function"
                ) {

                    setLanguage(this.value);

                }

            }
        );

    }

    (function initReviews() {
        const submitBtn = document.getElementById("submitReviewButton");

        const textInput = document.getElementById("reviewText");
        const messageEl = document.getElementById("reviewMessage");
        const container = document.getElementById("reviewsContainer");

        const currentBook = JSON.parse(sessionStorage.getItem("selectedBook")) || {};
        const bookKey = "literaryEmporiumReviews_" + (currentBook.id || currentBook.title || "default").replace(/[^a-zA-Z0-9]/g, "_");

        function getReviews() {
            try {
                const stored = JSON.parse(localStorage.getItem(bookKey));
                if (Array.isArray(stored) && stored.length > 0) return stored;
            } catch (e) {}

            return [
                {

                    rating: 5,
                    date: "10 Oct 2026",
                    comment: "Exceptional quality and fast delivery. One of the finest editions available in the marketplace!"
                },

                    user: "Arun Kumar",
                    rating: 4,
                    date: "04 Oct 2026",
                    comment: "Thoroughly researched content and great print quality. Highly recommended for avid readers."
                }
            ];
        }

        function saveReviews(reviews) {
            localStorage.setItem(bookKey, JSON.stringify(reviews));
        }

        function escapeReviewHTML(str) {
            return String(str || "").replace(/[&<>"']/g, function(c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
        }

        function renderReviews() {
            const reviews = getReviews();
            container.innerHTML = "";
            if (!reviews || reviews.length === 0) {
                container.innerHTML = '<p class="no-reviews" data-i18n="noReviews">No reviews yet.</p>';
                return;
            }

            reviews.forEach(function(r) {
                const item = document.createElement("div");
                item.className = "review-item";
                const stars = "★".repeat(Number(r.rating) || 5) + "☆".repeat(Math.max(0, 5 - (Number(r.rating) || 5)));
                item.innerHTML = `
                    <div class="review-rating">${stars} (${r.rating}/5)</div>
                    <div class="review-user">${escapeReviewHTML(r.user)} <span style="font-size:11px;color:#8894a0;font-weight:normal;margin-left:8px;">${escapeReviewHTML(r.date)}</span></div>
                    <div class="review-content">${escapeReviewHTML(r.comment)}</div>
                `;
                container.appendChild(item);
            });
        }

        if (submitBtn) {
            submitBtn.addEventListener("click", function() {
                const comment = textInput ? textInput.value.trim() : "";
                const rating = ratingInput ? parseInt(ratingInput.value, 10) || 5 : 5;

                if (!comment) {
                    if (messageEl) {
                        messageEl.textContent = "Please write a few words for your review.";
                        messageEl.style.color = "#8a2638";
                    }
                    return;
                }

                let userName = "Verified Reader";
                try {
                    const loggedIn = JSON.parse(localStorage.getItem("literaryEmporiumLoggedInUser"));
                    if (loggedIn && (loggedIn.name || loggedIn.fullName)) {
                        userName = (loggedIn.name || loggedIn.fullName) + " (Verified Buyer)";
                    }
                } catch (e) {}

                const reviews = getReviews();
                const now = new Date();
                const dateStr = now.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });

                reviews.unshift({
                    user: userName,
                    rating: rating,
                    date: dateStr,
                    comment: comment
                });

                saveReviews(reviews);
                renderReviews();

                if (textInput) textInput.value = "";
                if (messageEl) {
                    messageEl.textContent = "Thank you! Your review has been submitted successfully.";
                    messageEl.style.color = "#315c49";
                    setTimeout(function() { messageEl.textContent = ""; }, 4000);
                }
            });
        }

        renderReviews();
    })();

    applyBookDetailsLanguage();

</script>

<script src="chatbot.js?v=3"></script>
