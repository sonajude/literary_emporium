<script>


/* =========================================
   GET SELLERS
========================================= */

function getSellers() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "literaryEmporiumSellers"
            )
        ) || [];

    } catch (error) {

        return [];

    }

}



/* =========================================
   SAFE HTML
========================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================
   DISPLAY SELLERS
========================================= */

function displaySellers() {

    const sellers =
        getSellers();


    const sellersTable =
        document.getElementById(
            "adminSellersTable"
        );


    const emptyMessage =
        document.getElementById(
            "emptySellerMessage"
        );


    const sellerCount =
        document.getElementById(
            "sellerCount"
        );


    sellerCount.textContent =
        sellers.length;


    sellersTable.innerHTML = "";


    if (sellers.length === 0) {

        emptyMessage.style.display =
            "block";

        return;

    }


    emptyMessage.style.display =
        "none";


    sellers.forEach(
        function(seller, index) {

            const row =
                document.createElement("tr");


            const name =
                seller.name ||
                "Unnamed Seller";


            const email =
                seller.email ||
                "No email available";


            row.innerHTML = `

                <td class="seller-name">
                    ${escapeHtml(name)}
                </td>

                <td>
                    ${escapeHtml(email)}
                </td>

                <td class="status"
                    data-i18n="active">
                    Active
                </td>

                <td>

                    <button
                        type="button"
                        class="remove-button"
                        onclick="removeSeller(${index})"
                        data-i18n="remove">

                        Remove

                    </button>

                </td>

            `;


            sellersTable.appendChild(row);

        }
    );


    applyLanguage();

}



/* =========================================
   REMOVE SELLER
========================================= */

function removeSeller(index) {

    const sellers =
        getSellers();


    if (!sellers[index]) {
        return;
    }


    const sellerName =
        sellers[index].name ||
        "this seller";


    const language =
        localStorage.getItem(
            "literaryEmporiumLanguage"
        ) || "en";


    const confirmText =
        getRemoveConfirmation(
            language,
            sellerName
        );


    const confirmRemoval =
        confirm(confirmText);


    if (!confirmRemoval) {
        return;
    }


    const removedSeller =
        sellers[index];


    sellers.splice(index, 1);


    localStorage.setItem(
        "literaryEmporiumSellers",
        JSON.stringify(sellers)
    );


    /*
     * Remove seller's books as well.
     * This keeps the marketplace data consistent.
     */

    const books =
        getSellerBooks();


    const updatedBooks =
        books.filter(
            function(book) {

                return (
                    book.sellerEmail !==
                    removedSeller.email
                );

            }
        );


    localStorage.setItem(
        "literaryEmporiumSellerBooks",
        JSON.stringify(updatedBooks)
    );


    /*
     * If the removed seller is currently
     * stored as the active seller,
     * clear that session.
     */

    const currentSeller =
        localStorage.getItem(
            "literaryEmporiumCurrentSeller"
        );


    if (currentSeller) {

        try {

            const current =
                JSON.parse(currentSeller);


            if (
                current.email ===
                removedSeller.email
            ) {

                localStorage.removeItem(
                    "literaryEmporiumCurrentSeller"
                );

            }

        } catch (error) {

            /* Ignore invalid stored data */

        }

    }


    displaySellers();

}



/* =========================================
   GET SELLER BOOKS
========================================= */

function getSellerBooks() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "literaryEmporiumSellerBooks"
            )
        ) || [];

    } catch (error) {

        return [];

    }

}



/* =========================================
   REMOVE CONFIRMATION
========================================= */

function getRemoveConfirmation(
    language,
    name
) {

    const messages = {

        en:
            'Remove seller "' +
            name +
            '"?',

        ta:
            '"' +
            name +
            '" விற்பனையாளரை நீக்க வேண்டுமா?',

        hi:
            '"' +
            name +
            '" विक्रेता को हटाना है?',

        te:
            '"' +
            name +
            '" విక్రేతను తొలగించాలా?',

        ml:
            '"' +
            name +
            '" വിൽപ്പനക്കാരനെ നീക്കം ചെയ്യണോ?'

    };


    return messages[language] ||
           messages.en;

}

/* =========================================
   APPLY LANGUAGE
========================================= */

function applyLanguage() {

    const language =
        localStorage.getItem(
            "literaryEmporiumLanguage"
        ) || "en";


    const selected =
        translations[language] ||
        translations.en;


    document
        .querySelectorAll("[data-i18n]")
        .forEach(
            function(element) {

                const key =
                    element.getAttribute(
                        "data-i18n"
                    );


                if (selected[key]) {

                    element.textContent =
                        selected[key];

                }

            }
        );


    const selector =
        document.getElementById(
            "languageSelector"
        );


    if (selector) {

        selector.value =
            language;

    }

}



/* =========================================
   LANGUAGE SELECTOR
========================================= */

document
    .getElementById("languageSelector")
    .addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "literaryEmporiumLanguage",
                this.value
            );


            applyLanguage();

            displaySellers();

        }
    );



/* =========================================
