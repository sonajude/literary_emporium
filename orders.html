<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | Literary Emporium</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #172536;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        select {
            font: inherit;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {
            background: #172536;
            color: #ffffff;

            padding: 20px 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 4px;
            color: #cbd3da;
            font-size: 11px;
        }

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: #ffffff;
            font-size: 13px;
        }

        nav a:hover {
            color: #d7aeb7;
        }


        /* =====================================================
           LANGUAGE
           ===================================================== */

        .language-select {
            padding: 7px 9px;

            background: #172536;
            color: #ffffff;

            border: 1px solid #778492;

            font-size: 12px;
            cursor: pointer;
        }


        /* =====================================================
           PAGE
           ===================================================== */

        main {
            width: 90%;
            max-width: 1150px;

            margin: 45px auto 70px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 34px;
            font-weight: 400;

            color: #172536;

            margin-bottom: 8px;
        }

        .page-header p {
            color: #687586;
            font-size: 14px;
        }


        /* =====================================================
           ORDER COUNT
           ===================================================== */

        .order-count {
            margin-bottom: 22px;

            padding-bottom: 14px;

            border-bottom:
                1px solid #d9dee3;

            color: #687586;

            font-size: 13px;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {
            margin-bottom: 20px;

            padding: 12px 15px;

            background: #eef4f0;

            border:
                1px solid #c5d7cc;

            color: #315c49;

            font-size: 13px;

            display: none;
        }

        .message.show {
            display: block;
        }


        /* =====================================================
           ORDER CARD
           ===================================================== */

        .order-card {
            background: #ffffff;

            border:
                1px solid #d7dde3;

            margin-bottom: 22px;

            padding: 24px;
        }

        .order-top {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            padding-bottom: 16px;

            border-bottom:
                1px solid #e2e6e9;
        }

        .order-id {
            color: #172536;

            font-size: 15px;
            font-weight: 700;
        }

        .order-date {
            margin-top: 4px;

            color: #7a8692;

            font-size: 12px;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .status {
            display: inline-block;

            padding: 6px 10px;

            border: 1px solid #cbd2d8;

            background: #f7f8f9;

            color: #475562;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
        }

        .status.placed {
            border-color: #aab7c2;
            color: #344c60;
        }

        .status.processing {
            border-color: #9db1c0;
            color: #31516b;
        }

        .status.shipped {
            border-color: #9eb7ab;
            color: #315c49;
        }

        .status.out {
            border-color: #9eb7ab;
            color: #315c49;
        }

        .status.delivered {
            border-color: #78a38f;
            color: #24563b;
        }

        .status.cancelled {
            border-color: #caa5ac;
            color: #7b2938;
        }


        /* =====================================================
           CUSTOMER
           ===================================================== */

        .customer-info {
            padding: 18px 0;

            border-bottom:
                1px solid #e2e6e9;
        }

        .customer-info h3 {
            margin-bottom: 8px;

            color: #172536;

            font-size: 14px;
        }

        .customer-info p {
            color: #687586;

            font-size: 12px;

            line-height: 1.7;
        }


        /* =====================================================
           BOOKS
           ===================================================== */

        .books-heading {
            margin: 18px 0 10px;

            color: #172536;

            font-size: 14px;
            font-weight: 700;
        }

        .book-row {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 12px 0;

            border-bottom:
                1px solid #edf0f2;
        }

        .book-name {
            color: #34424e;

            font-size: 13px;

            flex: 1;
        }

        .book-qty {
            color: #7a8692;

            font-size: 12px;

            white-space: nowrap;
        }

        .book-price {
            color: #172536;

            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* =====================================================
           TOTAL
           ===================================================== */

        .order-total {
            margin-top: 18px;

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 25px;
        }

        .order-total span:first-child {
            color: #687586;
            font-size: 13px;
        }

        .order-total span:last-child {
            color: #172536;

            font-size: 18px;
            font-weight: 700;
        }


        /* =====================================================
           CANCELLATION POLICY
           ===================================================== */

        .cancellation-note {
            margin-top: 16px;

            padding: 11px 13px;

            font-size: 11px;

            line-height: 1.5;
        }

        .cancellation-note.allowed {
            background: #f7f8f9;

            border-left:
                3px solid #315c49;

            color: #58677a;
        }

        .cancellation-note.shipped {
            background: #f8f1f2;

            border-left:
                3px solid #7b2938;

            color: #7b2938;
        }

        .cancellation-note.expired {
            background: #f7f8f9;

            border-left:
                3px solid #9b8a69;

            color: #6f6250;
        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .order-actions {
            display: flex;

            justify-content: flex-end;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 20px;

            padding-top: 16px;

            border-top:
                1px solid #e2e6e9;
        }

        .action-button {
            display: inline-block;

            padding: 10px 15px;

            border:
                1px solid #172536;

            background: #172536;

            color: #ffffff;

            font-size: 12px;

            cursor: pointer;
        }

        .action-button:hover {
            background: #2b4051;
            border-color: #2b4051;
        }

        .cancel-button {
            background: #ffffff;

            color: #7b2938;

            border-color: #b68a93;
        }

        .cancel-button:hover {
            background: #f8eef0;

            color: #6a1f2f;

            border-color: #9e6974;
        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .empty-orders {
            background: #ffffff;

            border:
                1px solid #d7dde3;

            padding: 55px 25px;

            text-align: center;
        }

        .empty-orders h2 {
            margin-bottom: 9px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            font-weight: 400;

            color: #172536;
        }

        .empty-orders p {
            margin-bottom: 18px;

            color: #687586;

            font-size: 13px;
        }

        .shop-button {
            display: inline-block;

            padding: 11px 18px;

            background: #172536;

            color: #ffffff;

            font-size: 12px;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        footer {
            padding: 25px;

            background: #172536;

            color: #cbd3da;

            text-align: center;

            font-size: 12px;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                width: 100%;
            }

            main {
                width: 94%;
                margin-top: 30px;
            }

            .page-header h1 {
                font-size: 29px;
            }

            .order-card {
                padding: 18px;
            }

            .order-top {
                flex-direction: column;
            }

            .order-actions {
                justify-content: flex-start;
            }

        }


        @media (max-width: 480px) {

            .book-row {
                flex-direction: column;
                gap: 4px;
            }

            .order-total {
                justify-content: space-between;
            }

            .order-actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

    function getStatusClass(status) {

        if (
            value === "processing"
        ) {

        ) {

        if (

            )

        ) {

    /* =====================================================
       ORDER TIMESTAMP

       Priority:
       1. createdAt
       2. timestamp inside orderId
       3. old date value
       ===================================================== */

    function getOrderTimestamp(order) {

        if (!order) {
            return NaN;
        }


        /* 1. createdAt */

        if (
            order.createdAt
        ) {

            const createdTime =
                new Date(
                    order.createdAt
                ).getTime();


            if (
                !isNaN(
                    createdTime
                )
            ) {

                return createdTime;

            }

        }


        /* 2. ORD- + Date.now() */

        if (
            order.orderId
        ) {

            const match =
                String(
                    order.orderId
                ).match(
                    /(\d{10,})$/
                );


            if (match) {

                const idTime =
                    Number(
                        match[1]
                    );


                if (
                    !isNaN(
                        idTime
                    )
                ) {

                    return idTime;

                }

            }

        }


        /* 3. Older date */

        if (
            order.date
        ) {

            const dateTime =
                new Date(
                    order.date
                ).getTime();


            if (
                !isNaN(
                    dateTime
                )
            ) {

                return dateTime;

            }

        }


        return NaN;

    }


    /* =====================================================
       CAN CANCEL

       Rules:
       - Only Order Placed
       - Only Processing
       - Maximum 48 hours
       - Never after shipping
       ===================================================== */

    function canCancel(order) {

        if (!order) {
            return false;
        }


        const status =
            String(
                order.status ||
                "Order Placed"
            )
            .trim()
            .toLowerCase();


        /* Once shipped, cancellation is forbidden */

        if (
            status === "shipped" ||
            status.includes(
                "out for delivery"
            ) ||
            status === "delivered" ||
            status === "cancelled"
        ) {

            return false;

        }


        /* Only these two statuses are cancellable */

        if (
            status !== "order placed" &&
            status !== "processing"
        ) {

            return false;

        }


        const orderTime =
            getOrderTimestamp(
                order
            );


        if (
            isNaN(
                orderTime
            )
        ) {

            return false;

        }


        const elapsed =
            Date.now() -
            orderTime;


        const TWO_DAYS =
            48 *
            60 *
            60 *
            1000;


        return (
            elapsed >= 0 &&
            elapsed <= TWO_DAYS
        );

    }


    /* =====================================================
       CANCELLATION NOTE
       ===================================================== */

    function getCancellationNote(order) {

        const data =
            getLanguageData();


        if (!order) {
            return "";
        }


        const status =
            String(
                order.status ||
                "Order Placed"
            )
            .trim()

        /* Shipped */

        if (

        ) {

            return `

                <div class="cancellation-note shipped">

                    ${escapeHTML(
                        data.shippedNote
                    )}

                </div>

            `;

        }


        /* Out for Delivery */

        if (
            status.includes(
                "out for delivery"
            )
        ) {

            return `

                <div class="cancellation-note shipped">

                    ${escapeHTML(
                        data.outDeliveryNote
                    )}

                </div>

            `;

        }


        /* Delivered */

        if (
            status === "delivered"
        ) {

            return `

                <div class="cancellation-note shipped">

                    ${escapeHTML(
                        data.deliveredNote
                    )}

                </div>

            `;

        }


        /* Cancelled */

        if (
            status === "cancelled"
        ) {

            return `

                <div class="cancellation-note shipped">

                    ${escapeHTML(
                        data.cancelledNote
                    )}

                </div>

            `;

        }


        /* Order placed / processing */

        if (
            status === "order placed" ||
            status === "processing"
        ) {

            if (
                canCancel(order)
            ) {

                return `

                    <div class="cancellation-note allowed">

                        ${escapeHTML(
                            data.allowedNote
                        )}

                    </div>

                `;

            }


            return `

                <div class="cancellation-note expired">

                    ${escapeHTML(
                        data.expiredNote
                    )}

                </div>

            `;

        }


        return "";

    }


    /* =====================================================
       CANCEL ORDER
       ===================================================== */

    window.cancelOrder =
        function (orderId) {

            const orders =
                getOrders();


            const index =
                orders.findIndex(
                    function (item) {

                        return (
                            String(
                                item.orderId
                            ) ===
                            String(
                                orderId
                            )
                        );

                    }
                );


            const data =
                getLanguageData();


            if (
                index === -1
            ) {

                showMessage(
                    data.orderNotFound,
                    true
                );

                return;

            }


            const order =
                orders[index];


            /* USER CHECK */

            const currentUser =
                getCurrentUser();


            if (
                !currentUser ||
                !currentUser.email
            ) {

                showMessage(
                    data.loginRequired,
                    true
                );

                return;

            }


            /* OWNERSHIP CHECK */

            const orderEmail =
                order.customer &&
                order.customer.email

                    ? String(
                        order.customer.email
                    )
                        .trim()
                        .toLowerCase()

                    : "";


            const userEmail =
                String(
                    currentUser.email
                )
                    .trim()
                    .toLowerCase();


            if (
                !orderEmail ||
                orderEmail !==
                userEmail
            ) {

                showMessage(
                    data.ownOrder,
                    true
                );

                return;

            }


            /* STATUS + TIME CHECK */

            if (
                !canCancel(order)
            ) {

                const status =
                    String(
                        order.status ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                if (
                    status === "shipped"
                ) {

                    showMessage(
                        data.shippedMessage,
                        true
                    );

                } else {

                    showMessage(
                        data.expired,
                        true
                    );

                }


                renderOrders();

                return;

            }


            /* CONFIRM */

            const confirmed =
                window.confirm(
                    data.confirmCancel
                );


            if (!confirmed) {

                return;

            }


            /* FINAL VALIDATION */

            if (
                !canCancel(order)
            ) {

                showMessage(
                    data.expired,
                    true
                );

                renderOrders();

                return;

            }


            /* CANCEL */

            order.status =
                "Cancelled";


            order.cancelledAt =
                new Date().toISOString();


            localStorage.setItem(
                ORDERS_KEY,
                JSON.stringify(
                    orders
                )
            );


            showMessage(
                data.cancelSuccess,
                false
            );


            renderOrders();

        };

            currentUser &&
            currentUser.email
        ) {

            const userEmail =
                String(
                    currentUser.email
                )
                .trim()
                .toLowerCase();


            orders =
                allOrders.filter(
                    function (order) {

                        const email =
                            order.customer &&
                            order.customer.email

                                ? String(
                                    order.customer.email
                                )
                                .trim()
                                .toLowerCase()

                                : "";


                        return (
                            email ===
                            userEmail
                        );

                    }
                );

        /* COUNT */

        if (countElement) {

            const data =
                getLanguageData();


            countElement.textContent =
                orders.length +
                " " +
                (
                    orders.length === 1
                        ? data.order
                        : data.orders
                );

            orders.length === 0
        ) {

            container.innerHTML = `

    /* =====================================================

    function createOrderCard(
        order
    ) {

        const data =
            getLanguageData();


        const orderId =
            order.orderId ||
            "Order ID unavailable";


        const orderDate =
            order.date ||
            "—";


        const status =
            order.status ||
            "Order Placed";

            order.customer ||

            customer.name ||
            data.unknownCustomer;


        const customerEmail =
            customer.email ||
            "—";


        const customerPhone =
            customer.phone ||
            "—";


        const customerAddress =
            customer.address ||
            "—";


        const items =
            Array.isArray(
                order.items
            )
                ? order.items
                : [];


        const total =
            Number(
                order.total
            );


        const calculatedTotal =
            !isNaN(total)

                ? total

                : items.reduce(
                    function (
                        sum,
                        item
                    ) {

                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        return (
                            sum +
                            price *
                            quantity
                        );

                    },
                    0
                );


        /* =================================================
           BOOKS
           ================================================= */

        const itemsHTML =
            items.length > 0

                ? items.map(
                    function (item) {

                        const title =
                            item.title ||
                            data.unknownBook;


                        const author =
                            item.author ||
                            "";


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        return `

                            <div class="book-row">

                                <div class="book-name">

                                    <strong>

                                        ${escapeHTML(
                                            title
                                        )}

                                    </strong>


                                    ${
                                        author
                                            ? `

                                                <div
                                                    style="
                                                        font-size:11px;
                                                        color:#8a95a1;
                                                        margin-top:3px;
                                                    "
                                                >

                                                    ${escapeHTML(
                                                        author
                                                    )}

                                                </div>

                                            `
                                            : ""
                                    }

                                </div>


                                <div class="book-qty">

                                    ${escapeHTML(
                                        data.quantity
                                    )}

                                    :
                                    ${quantity}

                                </div>


                                <div class="book-price">

                                    ${formatMoney(
                                        price *
                                        quantity
                                    )}

                                </div>

                            </div>

                        `;

                    }
                ).join("")

                : `

                    <div class="book-row">

                        <div class="book-name">

                            ${escapeHTML(
                                data.unknownBook
                            )}

                        </div>

                    </div>

                `;


        /* =================================================
           CANCEL BUTTON
           ================================================= */

        const cancelButton =
            canCancel(
                order
            )

                ? `

                    <button
                        type="button"
                        class="action-button cancel-button"
                        onclick="
                            cancelOrder(
                                '${escapeHTML(
                                    orderId
                                )}'
                            )
                        "
                    >

                        ${escapeHTML(
                            data.cancel
                        )}

                    </button>

                `

                : "";


        /* =================================================
           CANCELLATION NOTE
           ================================================= */

        const cancellationNote =
            getCancellationNote(
                order
            );


        /* =================================================
           FINAL CARD
           ================================================= */

        return `

            <article class="order-card">


                <div class="order-top">

                    <div>

                        <div class="order-id">

                            ${escapeHTML(
                                orderId
                            )}

                        </div>


                        <div class="order-date">

                            ${escapeHTML(
                                orderDate
                            )}

                        </div>

                    </div>


                    <div>

                        <span
                            class="status ${getStatusClass(
                                status
                            )}"
                        >

                            ${escapeHTML(
                                getStatusLabel(
                                    status
                                )
                            )}

                        </span>

                    </div>

                </div>


                <div class="customer-info">

                    <h3>

                        ${escapeHTML(
                            data.customer
                        )}

                    </h3>


                    <p>

                        <strong>

                            ${escapeHTML(
                                customerName
                            )}

                        </strong>

                        <br>

                        ${escapeHTML(
                            customerEmail
                        )}

                        <br>

                        ${escapeHTML(
                            customerPhone
                        )}

                        <br>

                        ${escapeHTML(
                            customerAddress
                        )}

                    </p>

                </div>


                <div class="books-heading">

                    ${escapeHTML(
                        data.books
                    )}

                </div>


                <div>

                    ${itemsHTML}

                </div>


                <div class="order-total">

                    <span>

                        ${escapeHTML(
                            data.total
                        )}

                    </span>

                    <span>

                        ${formatMoney(
                            calculatedTotal
                        )}

                    </span>

                </div>


                ${cancellationNote}


                <div class="order-actions">


                    <button
                        type="button"
                        class="action-button"
                        onclick="
                            trackOrder(
                                '${escapeHTML(
                                    orderId
                                )}'
                            )
                        "
                    >

                        ${escapeHTML(
                            data.track
                        )}

                    </button>


                    ${cancelButton}


                </div>


            </article>

        `;

    }


    /* =====================================================
       INITIALISE
       ===================================================== */

    applyPageLanguage();


    /* =====================================================
       REFRESH WHEN RETURNING TO PAGE
       ===================================================== */

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                !document.hidden
            ) {

                renderOrders();

            }

        }
    );


})();

</script>


<script src="chatbot.js?v=3"></script>

</body>

</html>
