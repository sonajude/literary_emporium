<script>


/* =========================================
   GET BUYERS
========================================= */

function getBuyers() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "literaryEmporiumUsers"
            )
        ) || [];

    } catch (error) {

        return [];

    }

}



/* =========================================
   SAFE HTML
========================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================
   DISPLAY BUYERS
========================================= */

function loadBuyers() {

    const buyers =
        getBuyers();


    const table =
        document.getElementById(
            "buyersTable"
        );


    const tableBody =
        document.getElementById(
            "buyersTableBody"
        );


    const emptyMessage =
        document.getElementById(
            "emptyMessage"
        );


    const buyerCount =
        document.getElementById(
            "buyerCount"
        );


    buyerCount.textContent =
        buyers.length;


    tableBody.innerHTML = "";


    if (buyers.length === 0) {

        table.style.display =
            "none";

        emptyMessage.style.display =
            "block";

        return;

    }


    table.style.display =
        "table";

    emptyMessage.style.display =
        "none";


    buyers.forEach(
        function(buyer, index) {

            const row =
                document.createElement("tr");


            const buyerName =
                buyer.fullName ||
                buyer.name ||
                "Unnamed Buyer";


            const email =
                buyer.email ||
                "No email available";


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td class="buyer-name">
                    ${escapeHtml(buyerName)}
                </td>

                <td>
                    ${escapeHtml(email)}
                </td>

                <td>

                    <button
                        type="button"
                        class="remove-button"
                        onclick="removeBuyer(${index})"
                        data-i18n="remove">

                        Remove

                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        }
    );


    applyLanguage();

}



/* =========================================
   REMOVE BUYER
========================================= */

function removeBuyer(index) {

    const buyers =
        getBuyers();


    if (!buyers[index]) {
        return;
    }


    const buyerName =
        buyers[index].fullName ||
        buyers[index].name ||
        "this buyer";


    const language =
        localStorage.getItem(
            "literaryEmporiumLanguage"
        ) || "en";


    const confirmation =
        confirm(
            getRemoveConfirmation(
                language,
                buyerName
            )
        );


    if (!confirmation) {
        return;
    }


    const removedBuyer =
        buyers[index];


    buyers.splice(index, 1);


    localStorage.setItem(
        "literaryEmporiumUsers",
        JSON.stringify(buyers)
    );


    /*
     * Clear current buyer session
     * if the removed account is logged in.
     */

    const currentBuyer =
        localStorage.getItem(
            "literaryEmporiumLoggedInUser"
        );


    if (currentBuyer) {

        try {

            const loggedInBuyer =
                JSON.parse(currentBuyer);


            if (
                loggedInBuyer.email ===
                removedBuyer.email
            ) {

                localStorage.removeItem(
                    "literaryEmporiumLoggedInUser"
                );

            }

        } catch (error) {

            /* Ignore invalid session data */

        }

    }


    /*
     * Remove saved address belonging
     * to the deleted buyer.
     */

    if (removedBuyer.email) {

        localStorage.removeItem(
            "literaryEmporiumSavedAddress_" +
            removedBuyer.email
        );

    }


    loadBuyers();

}



/* =========================================
   REMOVE CONFIRMATION
========================================= */

function getRemoveConfirmation(
    language,
    name
) {

    const messages = {

        en:
            'Remove buyer "' +
            name +
            '"?',

        ta:
            '"' +
            name +
            '" வாங்குபவரை நீக்க வேண்டுமா?',

        hi:
            '"' +
            name +
            '" खरीदार को हटाना है?',

        te:
            '"' +
            name +
            '" కొనుగోలుదారుని తొలగించాలా?',

        ml:
            '"' +
            name +
            '" വാങ്ങുന്നയാളെ നീക്കം ചെയ്യണോ?'

    };


    return messages[language] ||
           messages.en;

}

/* =========================================
   APPLY LANGUAGE
========================================= */

function applyLanguage() {

    const language =
        localStorage.getItem(
            "literaryEmporiumLanguage"
        ) || "en";


    const selected =
        translations[language] ||
        translations.en;


    document
        .querySelectorAll("[data-i18n]")
        .forEach(
            function(element) {

                const key =
                    element.getAttribute(
                        "data-i18n"
                    );


                if (selected[key]) {

                    element.textContent =
                        selected[key];

                }

            }
        );


    const selector =
        document.getElementById(
            "languageSelector"
        );


    if (selector) {

        selector.value =
            language;

    }

}



/* =========================================
   LANGUAGE SELECTOR
========================================= */

document
    .getElementById("languageSelector")
    .addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "literaryEmporiumLanguage",
                this.value
            );


            applyLanguage();

            loadBuyers();

        }
    );



/* =========================================
   LOGOUT
========================================= */

document
